name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Fire TV APK
        working-directory: TVHome
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TVHome.apk

      - name: Package Roku app
        working-directory: Roku
        run: zip -qr ../TVHome-Roku.zip manifest source components images fonts

      - name: Move the "latest" tag to this build
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Built from ${{ github.sha }}.
            - TVHome.apk: Fire TV app
            - TVHome-Roku.zip: Roku app (upload in the Roku developer installer)
          prerelease: false
          make_latest: true
          files: |
            TVHome.apk
            TVHome-Roku.zip
